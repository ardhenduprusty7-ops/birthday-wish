<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 17th Birthday!</title>
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec 0%, #ffebee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* Floating Hearts Animation */
        .floating-heart {
            position: absolute;
            color: rgba(240, 98, 146, 0.4);
            font-size: 20px;
            animation: float 6s infinite ease-in;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            border: 4px double #f8bbd0;
            z-index: 10;
        }

        h1 { color: #880e4f; margin-bottom: 10px; font-size: 2.2em; }
        
        .bday-text {
            color: #d81b60;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        /* Music Button Styling */
        .music-btn {
            background: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .music-btn:hover {
            background: #ad1457;
            transform: scale(1.05);
        }

        .song-info {
            margin-top: 15px;
            font-size: 0.9em;
            color: #ad1457;
            font-style: italic;
        }
    </style>
</head>
<body>

    <audio id="mySong" loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div class="card">
        <span style="font-size: 3em;">🎁</span>
        <h1>Happy 17th!</h1>
        <div class="bday-text">To My Beautiful Wife</div>
        <p>"May your special day be filled with as much love and joy as you bring into my life every single day."</p>
        
        <div class="song-info">
            🎵 Currently Playing: <strong>Kesariya</strong>
        </div>

        <button class="music-btn" onclick="toggleMusic()" id="btnText">
            <span>Click for Music</span> ❤️
        </button>
    </div>

    <script>
        // Create Floating Hearts
        for (let i = 0; i < 15; i++) {
            let heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(heart);
        }

        // Music Control Function
        var song = document.getElementById("mySong");
        var btn = document.getElementById("btnText");

        function toggleMusic() {
            if (song.paused) {
                song.play();
                btn.innerHTML = "<span>Enjoy the Music</span> 🎵";
            } else {
                song.pause();
                btn.innerHTML = "<span>Play Music</span> ❤️";
            }
        }
    </script>
</body>
</html>
