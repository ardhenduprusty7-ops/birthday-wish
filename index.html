<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 17th Birthday!</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            border: 2px solid #f06292;
        }
        h1 { color: #d81b60; margin-bottom: 10px; }
        p { color: #555; line-height: 1.6; font-size: 1.1em; }
        .song-box {
            margin-top: 25px;
            padding: 15px;
            background: #fff1f5;
            border-radius: 10px;
            border-left: 5px solid #ec407a;
        }
        .heart { color: #e91e63; font-size: 1.5em; }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Happy 17th Birthday!</h1>
        <p>To my wonderful wife, may your day be as beautiful and bright as your smile. Cheers to another year of amazing memories together!</p>
        
        <div class="song-box">
            <strong>🎵 Now Playing in my Heart:</strong><br>
            <em>"Tum Se Hi" — Mohit Chauhan</em>
            <p style="font-size: 0.9em; margin-top: 5px; color: #880e4f;">
                "Aadha hai moon, aadhi hai raat...<br>
                Tum se hi din hota hai, surmayi shaam aati hai."
            </p>
        </div>
    </div>

</body>
</html>
